<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halloween · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Figtree:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="shared.js"></script>
</head>
<body>
<div class="wrap wide" id="app"></div>

<script>
const H = {
  players: [], live: { game: "none", phase: "idle", data: {} }, scores: [], matches: [],
  buzzes: [], answers: [], votes: [], noms: [], ranks: [],
  track: null, showTitle: false, handling: false, answerTimeout: null, lastSongScoreId: null,
  spotify: null,
};
const app = $("#app");
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// ============ PIN ============
if (ls.get("host-ok") !== CONFIG.HOST_PIN) {
  app.innerHTML = `<div class="card" style="max-width:360px;margin:40px auto">
    <span class="eyebrow">Panel del anfitrión</span><h1>Clave</h1>
    <form id="pf" class="row"><input id="pin" inputmode="numeric" placeholder="PIN"><button class="primary" style="width:100%">Entrar</button></form></div>`;
  $("#pf").onsubmit = (e) => { e.preventDefault(); if ($("#pin").value === CONFIG.HOST_PIN) { ls.set("host-ok", CONFIG.HOST_PIN); location.reload(); } else toast("PIN incorrecto"); };
} else setTimeout(boot, 0);   // arranca cuando todo el script ya cargó

// ============ Datos ============
async function setLive(game, phase, data) {
  H.live = { id: 1, game, phase, data, updated_at: new Date().toISOString() };
  await q(db.from("live_state").upsert(H.live));
  render();
}
async function loadAll() {
  [H.players, H.scores, H.matches] = await Promise.all([
    q(db.from("players").select("*").order("name")),
    q(db.from("scores").select("*").order("created_at", { ascending: false })),
    q(db.from("matches").select("*").order("created_at")),
  ]);
  H.live = (await q(db.from("live_state").select("*").eq("id", 1)))[0] || H.live;
  await loadGameData();
}
async function loadGameData() {
  const d = H.live.data || {};
  if (H.live.game === "cancion" && d.round) {
    H.buzzes = await q(db.from("buzzes").select("*").eq("round", d.round).order("id"));
    H.answers = await q(db.from("song_answers").select("*").eq("round", d.round).order("id"));
  }
  if (H.live.game === "trivia" && d.qid) H.votes = await q(db.from("trivia_votes").select("*").eq("question_id", d.qid));
  if (H.live.game === "disfraz") {
    H.noms = await q(db.from("costume_noms").select("*"));
    H.ranks = await q(db.from("costume_ranks").select("*"));
  }
}

async function boot() {
  await spotifyHandleRedirect();
  await loadAll();
  render();
  listen(["scores", "matches", "buzzes", "song_answers", "trivia_votes", "costume_noms", "costume_ranks"], async (t, p) => {
    if (t === "scores") H.scores = await q(db.from("scores").select("*").order("created_at", { ascending: false }));
    else if (t === "matches") H.matches = await q(db.from("matches").select("*").order("created_at"));
    else await loadGameData();
    if (t === "buzzes") await onBuzz();
    if (t === "song_answers" && p.eventType === "INSERT") await onAnswer(p.new);
    // Solo se redibuja el panel afectado, para no interrumpir lo que estés escribiendo
    if (t === "scores") renderScores();
    else if (t === "matches") { renderBeer(); renderHorse(); renderTriviaLive(); }
    else if (t === "trivia_votes") renderTriviaLive();
    else if (t.startsWith("costume")) renderCostume();
    else renderSong();
  });
  setInterval(refreshNowPlaying, 5000);

  // Trivia: cuenta regresiva y revelado automático al acabarse el tiempo (más unos segundos de gracia)
  setInterval(() => {
    if (H.live.game !== "trivia" || H.live.phase !== "open") return;
    const d = H.live.data, left = d.qid + d.secs * 1000 - Date.now();
    const el = $("#tTimer"); if (el) el.textContent = Math.max(0, Math.ceil(left / 1000));
    const key = ls.get("trivia-key", {});
    if (left <= -CONFIG.TRIVIA_GRACE * 1000 && key?.qid === d.qid) triviaReveal(key.correct);
  }, 500);

  // Respaldo: aunque falle la conexión en vivo, el panel revisa el buzzer cada segundo
  let lastSig = "";
  setInterval(async () => {
    if (document.hidden || H.live.game !== "cancion") return;
    const ph = H.live.phase;
    if (ph !== "playing" && ph !== "answering") return;
    try { await loadGameData(); } catch { return; }
    if (ph === "playing") await onBuzz();
    else {
      const d = songData();
      const a = H.answers.find((x) => x.attempt === d.attempt && x.player === d.player && !x.verdict);
      if (a) await onAnswer(a);
    }
    const s = sig(H.buzzes.length, H.answers.length, H.live.phase);
    if (s !== lastSig) { lastSig = s; renderSong(); }
  }, 1000);
  // Sin conexión en vivo: refresca votos y puntajes cada 3 s
  setInterval(async () => {
    if (document.hidden || window.RT_OK) return;
    try {
      H.scores = await q(db.from("scores").select("*").order("created_at", { ascending: false }));
      H.matches = await q(db.from("matches").select("*").order("created_at"));
      await loadGameData();
    } catch { return; }
    renderScores(); renderBeer(); renderHorse(); renderTriviaLive(); renderCostume();
  }, 3000);

  // Pedidos de canciones de los invitados: se revisan cada 2 s

  // Pantalla siempre encendida mientras el panel está abierto
  keepAwake();
  document.addEventListener("visibilitychange", async () => {
    if (document.hidden) return;
    keepAwake();
    try { await loadAll(); } catch {}
    render();
    if (H.live.game === "cancion" && H.live.phase === "playing") onBuzz();
  });
}
async function keepAwake() {
  try { if (navigator.wakeLock && !(H.wake && !H.wake.released)) H.wake = await navigator.wakeLock.request("screen"); } catch {}
}

// ============ Partir de cero ============
// Borra puntajes y resultados de todos los juegos. No toca los equipos ni los nombres elegidos.
async function resetAll() {
  try {
    clearTimeout(H.answerTimeout); clearTimeout(H.autoResume);
    await Promise.all([
      q(db.from("scores").delete().neq("id", 0)),
      q(db.from("buzzes").delete().neq("id", 0)),
      q(db.from("song_answers").delete().neq("id", 0)),
      q(db.from("matches").delete().neq("id", 0)),
      q(db.from("trivia_votes").delete().neq("question_id", -1)),
      q(db.from("costume_noms").delete().neq("player", "")),
      q(db.from("costume_ranks").delete().neq("player", "")),
    ]);
    try { await db.from("song_requests").delete().neq("id", 0); } catch {}
    ["song-round", "costume-cands", "bg-resume"].forEach((k) => ls.set(k, null));
    Object.assign(H, { scores: [], matches: [], buzzes: [], answers: [], votes: [], noms: [], ranks: [], track: null, handling: false, lastSongScoreId: null, lastSongMatchId: null });
    await setLive("none", "idle", {});
    toast("Listo: todo en cero");
  } catch (e) { toast("No se pudo borrar todo: " + (e.message || e)); render(); }
}

// ============ Render general ============
function render() {
  const g = H.live.game;
  app.innerHTML = `
    <div class="row" style="justify-content:space-between">
      <div><span class="eyebrow">Panel del anfitrión</span><h1>Halloween</h1></div>
      <div class="row">
        <a class="small muted" href="index.html" target="_blank">Abrir vista de jugadores ↗</a>
        <button class="small danger" id="resetAll">Partir de cero</button>
      </div>
    </div>
    <div class="card"><h3>En los celulares ahora</h3>
      <div class="row">${[["none", "Nada"], ...Object.entries(GAMES).filter(([k]) => k !== "extra")]
        .map(([k, l]) => `<button data-game="${k}" class="${g === k ? "sel" : ""}">${l}</button>`).join("")}</div></div>
    <div class="card" id="p-mic"></div>
    <div class="grid-host">
      <div class="card" id="p-song"></div>
      <div class="card" id="p-costume"></div>
      <div class="card" id="p-scores"></div>
      <div class="card" id="p-beer"></div>
      <div class="card" id="p-horse"></div>
    </div>`;
  app.querySelectorAll("[data-game]").forEach((b) => b.onclick = () => {
    const k = b.dataset.game;
    if (k === H.live.game) return;
    if (k === "cancion") return setLive("cancion", "waiting", { round: ls.get("song-round", 0), total: ls.get("song-total", 10), attempt: 1, locked: [] });
    if (k === "disfraz") return setLive("disfraz", "idle", { candidates: ls.get("costume-cands", {}) });
    setLive(k, "idle", {});
  });
  const rb = $("#resetAll");
  rb.onclick = async () => {
    if (!rb.dataset.c) { rb.dataset.c = 1; rb.textContent = "¿Borrar todo? Toca otra vez"; setTimeout(() => { if (rb.isConnected) { delete rb.dataset.c; rb.textContent = "Partir de cero"; } }, 4000); return; }
    rb.disabled = true; rb.textContent = "Borrando…";
    await resetAll();
  };
  renderMic(); renderSong(); renderCostume(); renderScores(); renderBeer(); renderHorse();
}

// ============ Spotify (PKCE, sin servidor) ============
const SP_SCOPES = "user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private playlist-read-collaborative";
const redirectUri = () => location.origin + location.pathname;
const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

async function spotifyConnect() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  ls.set("sp-verifier", verifier);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  const u = new URL("https://accounts.spotify.com/authorize");
  Object.entries({ response_type: "code", client_id: CONFIG.SPOTIFY_CLIENT_ID, scope: SP_SCOPES, code_challenge_method: "S256", code_challenge: challenge, redirect_uri: redirectUri() })
    .forEach(([k, v]) => u.searchParams.set(k, v));
  location.href = u.toString();
}
async function spotifyToken(params) {
  const r = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ client_id: CONFIG.SPOTIFY_CLIENT_ID, ...params }),
  });
  if (!r.ok) throw new Error("Spotify: " + (await r.text()));
  const t = await r.json();
  const prev = ls.get("sp-token", {});
  const tok = { access: t.access_token, refresh: t.refresh_token || prev.refresh, exp: Date.now() + (t.expires_in - 60) * 1000 };
  ls.set("sp-token", tok);
  return tok;
}
async function spotifyHandleRedirect() {
  const p = new URLSearchParams(location.search);
  if (p.get("code")) {
    try { await spotifyToken({ grant_type: "authorization_code", code: p.get("code"), redirect_uri: redirectUri(), code_verifier: ls.get("sp-verifier", "") }); toast("Spotify conectado"); }
    catch (e) { toast(e.message); }
    history.replaceState(null, "", location.pathname);
  }
}
const NO_DEVICE = "Abre la app de Spotify en el celular conectado al parlante y vuelve a intentar.";
async function sp(method, path, body, retried) {
  let tok = ls.get("sp-token", null);
  if (!tok) throw new Error("Conecta Spotify primero");
  if (Date.now() > tok.exp) tok = await spotifyToken({ grant_type: "refresh_token", refresh_token: tok.refresh });
  const r = await fetch("https://api.spotify.com/v1" + path, { method, headers: { Authorization: "Bearer " + tok.access, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 204 || r.status === 202) return null;
  if (!r.ok) {
    const txt = await r.text();
    if (r.status === 404 && !retried && path !== "/me/player" && path !== "/me/player/devices") {
      // Sin dispositivo activo: activamos el primero donde la app de Spotify esté abierta y reintentamos
      if (await ensureDevice()) return sp(method, path, body, true);
      throw new Error(NO_DEVICE);
    }
    if (r.status === 404) throw new Error(NO_DEVICE);
    throw new Error("Spotify " + r.status + ": " + txt.slice(0, 120));
  }
  const ct = r.headers.get("content-type") || "";
  return ct.includes("json") ? r.json() : null;
}
// Busca un dispositivo con Spotify abierto (prefiere el celular) y lo deja activo
async function ensureDevice() {
  try {
    const r = await sp("GET", "/me/player/devices", null, true);
    const list = r?.devices || [];
    if (list.some((d) => d.is_active)) return true;
    const dev = list.find((d) => d.type === "Smartphone") || list[0];
    if (!dev) return false;
    await sp("PUT", "/me/player", { device_ids: [dev.id], play: false }, true);
    await new Promise((res) => setTimeout(res, 800));
    toast("Spotify activado en " + dev.name);
    return true;
  } catch { return false; }
}
async function refreshNowPlaying() {
  if (!ls.get("sp-token", null)) return;
  try {
    const d = await sp("GET", "/me/player/currently-playing");
    const t = d?.item ? { title: d.item.name, artist: d.item.artists.map((a) => a.name).join(", "), playing: d.is_playing } : null;
    const changed = JSON.stringify(t) !== JSON.stringify(H.spotify);
    H.spotify = t;
    if (changed) renderSong();
  } catch (e) { /* silencioso */ }
}
const spPlay = () => sp("PUT", "/me/player/play").catch((e) => toast(e.message));
const spPause = () => sp("PUT", "/me/player/pause").catch((e) => toast(e.message));
async function spNext() { try { await sp("POST", "/me/player/next"); await new Promise((r) => setTimeout(r, 700)); } catch (e) { toast(e.message); } }

// ============ Micrófono para avisos ============
// Tu voz sale por el parlante conectado a este celular. Al hablar, Spotify se pausa y vuelve al terminar.
H.mic = { on: false, stream: null, ctx: null, gain: null, wasPlaying: false, vol: ls.get("mic-vol", 1.5) };

async function micStart() {
  if (H.mic.on) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    H.mic.wasPlaying = !!H.spotify?.playing;
    if (H.mic.wasPlaying) await spPause();
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    const src = ctx.createMediaStreamSource(stream);
    const gain = ctx.createGain(); gain.gain.value = H.mic.vol;
    const comp = ctx.createDynamicsCompressor();   // evita que los gritos saturen
    src.connect(gain).connect(comp).connect(ctx.destination);
    Object.assign(H.mic, { on: true, stream, ctx, gain });
  } catch (e) {
    toast(e?.name === "NotAllowedError" ? "Da permiso al micrófono en el navegador" : "No se pudo abrir el micrófono");
  }
  renderMic();
}
async function micStop() {
  if (!H.mic.on) return;
  H.mic.stream?.getTracks().forEach((t) => t.stop());
  try { await H.mic.ctx?.close(); } catch {}
  const resume = H.mic.wasPlaying;
  Object.assign(H.mic, { on: false, stream: null, ctx: null, gain: null, wasPlaying: false });
  renderMic();
  if (resume) spPlay();
}
function renderMic() {
  const el = $("#p-mic"); if (!el) return;
  const m = H.mic;
  el.innerHTML = `<div class="row" style="justify-content:space-between;align-items:center">
      <div><h2>Micrófono</h2><p class="small muted">Habla por el parlante. La música se pausa mientras hablas.</p></div>
      <button id="micBtn" class="${m.on ? "danger" : "primary"}" style="min-width:150px">${m.on ? "■ Terminar" : "🎤 Hablar"}</button>
    </div>
    <label>Volumen de la voz<input id="micVol" type="range" min="0.5" max="4" step="0.1" value="${m.vol}"></label>
    ${m.on ? `<p class="small"><strong style="color:var(--bad)">● Al aire.</strong> Aléjate del parlante si se escucha un pitido.</p>` : ""}`;
  $("#micBtn").onclick = () => (H.mic.on ? micStop() : micStart());
  $("#micVol").oninput = (e) => { H.mic.vol = Number(e.target.value); ls.set("mic-vol", H.mic.vol); if (H.mic.gain) H.mic.gain.gain.value = H.mic.vol; };
}

// ============ Adivina la canción ============
function songData() { return { round: 0, total: 10, attempt: 1, locked: [], ...(H.live.data || {}) }; }

async function openSong(next) {
  if (next) await spNext();   // pasa a la siguiente canción de lo que esté sonando en Spotify
  await refreshNowPlaying();
  if (!H.spotify) {   // nada cargado: intenta partir la reproducción
    await spPlay();
    await new Promise((res) => setTimeout(res, 1200));
    await refreshNowPlaying();
  }
  if (!H.spotify) return toast("Pon a sonar una playlist en Spotify y vuelve a intentar");
  H.track = { title: H.spotify.title, artist: H.spotify.artist };
  const d = songData();
  const round = d.round + 1; ls.set("song-round", round);
  H.handling = false; H.lastSongScoreId = null; H.buzzes = []; H.answers = [];
  await spPlay();
  await setLive("cancion", "playing", { round, total: d.total, attempt: 1, locked: [] });
}
async function reopenSong() {
  const d = songData();
  H.handling = false;
  await spPlay();
  await setLive("cancion", "playing", { ...d, attempt: d.attempt + 1, team: null, player: null, result: null });
}
async function onBuzz() {
  if (H.live.game !== "cancion" || H.live.phase !== "playing" || H.handling) return;
  const d = songData();
  const first = H.buzzes.find((b) => b.attempt === d.attempt && !d.locked.includes(b.team));
  if (!first) return;
  H.handling = true;
  await spPause();
  await setLive("cancion", "answering", { ...d, team: first.team, player: first.player });
  clearTimeout(H.answerTimeout);
  H.answerTimeout = setTimeout(async () => {
    const cur = songData();
    if (H.live.phase === "answering" && cur.attempt === d.attempt) {
      await finishWrong(cur, { ok: false, timeout: true, team: cur.team, reason: "No alcanzó a escribir." });
    }
  }, (CONFIG.ANSWER_SECONDS + 3) * 1000);
}
async function onAnswer(a) {
  const d = songData();
  if (H.live.phase !== "answering" || a.round !== d.round || a.attempt !== d.attempt || a.player !== d.player) return;
  clearTimeout(H.answerTimeout);
  if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
  toast("Llegó la respuesta de " + a.player);
  // Tú decides: la respuesta queda esperando en el panel
  await setLive("cancion", "judging", { ...d, pending: { id: a.id, team: a.team, player: a.player, answer: a.answer } });
  document.getElementById("p-song")?.scrollIntoView({ behavior: "smooth", block: "start" });
}

// Tu veredicto desde el panel
async function judgeSong(ok) {
  const d = songData(), a = d.pending;
  if (H.live.phase !== "judging" || !a) return;
  const track = H.track || { title: H.spotify?.title, artist: H.spotify?.artist };
  await q(db.from("song_answers").update({ verdict: ok ? "ok" : "no" }).eq("id", a.id));
  const rest = { ...d, pending: null };
  if (ok) {
    const s = await q(db.from("scores").insert({ team: a.team, game: "cancion", points: CONFIG.SONG_POINTS, note: `Canción ${d.round}: ${track.title}` }).select());
    H.lastSongScoreId = s[0]?.id;
    const m = await q(db.from("matches").insert({ game: "cancion", data: { round: d.round, title: track.title, artist: track.artist, team: a.team } }).select());
    H.lastSongMatchId = m[0]?.id;
    await setLive("cancion", "result", { ...rest, result: { ok: true, team: a.team, answer: a.answer, title: track.title, artist: track.artist } });
  } else {
    await finishWrong(rest, { ok: false, team: a.team, answer: a.answer });
  }
}

// Respuesta mala o sin respuesta: se bloquea al equipo y la canción sigue sola.
// Si ya fallaron los 4 equipos, se revela la canción.
async function finishWrong(d, result) {
  const locked = [...new Set([...d.locked, result.team])];
  const track = H.track || { title: H.spotify?.title, artist: H.spotify?.artist };
  if (locked.length >= 4) {
    return setLive("cancion", "result", { ...d, locked, result: { ...result, ended: true, title: track.title, artist: track.artist } });
  }
  await setLive("cancion", "result", { ...d, locked, result });
  const attempt = d.attempt;
  clearTimeout(H.autoResume);
  H.autoResume = setTimeout(() => {
    const cur = songData();
    if (H.live.game === "cancion" && H.live.phase === "result" && cur.attempt === attempt && cur.result && !cur.result.ok) reopenSong();
  }, CONFIG.RESUME_SECONDS * 1000);
}
async function overrideSong(makeOk) {
  const d = songData(), r = d.result; if (!r) return;
  const track = H.track || {};
  clearTimeout(H.autoResume);
  if (makeOk && !r.ok) {
    const s = await q(db.from("scores").insert({ team: r.team, game: "cancion", points: CONFIG.SONG_POINTS, note: `Canción ${d.round}: ${track.title} (corregido)` }).select());
    H.lastSongScoreId = s[0]?.id;
    const m = await q(db.from("matches").insert({ game: "cancion", data: { round: d.round, title: track.title, artist: track.artist, team: r.team } }).select());
    H.lastSongMatchId = m[0]?.id;
    await setLive("cancion", "result", { ...d, locked: d.locked.filter((t) => t !== r.team), result: { ...r, ok: true, timeout: false, title: track.title, artist: track.artist } });
  } else if (!makeOk && r.ok) {
    if (H.lastSongScoreId) await q(db.from("scores").delete().eq("id", H.lastSongScoreId));
    H.lastSongScoreId = null;
    if (H.lastSongMatchId) await q(db.from("matches").delete().eq("id", H.lastSongMatchId));
    H.lastSongMatchId = null;
    await setLive("cancion", "result", { ...d, locked: [...d.locked, r.team], result: { ...r, ok: false, title: null } });
  }
}

function renderSong() {
  const el = $("#p-song"); if (!el) return;
  const d = songData(), ph = H.live.game === "cancion" ? H.live.phase : "off";
  const connected = !!ls.get("sp-token", null);
  const r = d.result;
  el.innerHTML = `
    <div class="row" style="justify-content:space-between"><h2>Canción</h2>
      <span class="muted small">Ronda ${d.round} de <input id="total" type="number" min="1" value="${d.total}" style="width:64px"></span></div>
    ${!connected ? `<button class="primary" id="spc">Conectar Spotify</button><p class="small muted">Necesita Spotify Premium y la app de Spotify abierta en algún dispositivo.</p>` : `
      <div class="list"><li><span class="small">${H.spotify ? (H.showTitle ? `<strong>${esc(H.spotify.title)}</strong> · ${esc(H.spotify.artist)}` : "Sonando: ••••••••") : "Nada sonando"}</span>
        <button id="eye" class="small">${H.showTitle ? "Ocultar" : "Ver"}</button></li></div>
      <div class="row"><button id="play">▶</button><button id="pause">⏸</button><button id="next">⏭</button>
        <button id="spx" class="small muted">Reconectar</button></div>`}
    ${ph === "off" ? `<p class="muted small">Pon "Canción" en los celulares para empezar.</p>` : `
      <p><strong>Estado:</strong> ${{ waiting: "Esperando", playing: `Sonando, buzzer abierto (intento ${d.attempt})`, answering: `${esc(d.player)} (equipo ${d.team}) está escribiendo…`, judging: "Te toca decidir", result: "Resultado" }[ph] || ph}
        ${d.locked.length ? `<br><span class="small muted">Bloqueados: ${d.locked.map(teamChip).join(" ")}</span>` : ""}</p>
      <div class="grid2">
        <button class="primary" id="openNext">Siguiente canción y abrir</button>
        <button id="openCur">Abrir con la que suena</button>
      </div>
      ${ph === "judging" && d.pending ? `
        <div class="card judge">
          <span class="eyebrow">${teamChip(d.pending.team)} ${esc(d.pending.player)} escribió</span>
          <div class="answer">“${esc(d.pending.answer)}”</div>
          <p class="small muted">Era: <strong>${esc(H.track?.title || H.spotify?.title || "?")}</strong> · ${esc(H.track?.artist || H.spotify?.artist || "")}</p>
          <div class="grid2"><button class="danger" id="jNo">✗ Incorrecta</button><button class="primary okbtn" id="jOk">✓ Correcta</button></div>
        </div>` : ""}
      ${ph === "result" && r ? `
        <div class="verdict ${r.ok ? "ok" : "no"}">${r.ok ? "Correcto" : r.timeout ? "Sin respuesta" : "Incorrecto"}</div>
        <p class="small">${teamChip(r.team)} “${esc(r.answer || "")}”${r.reason ? `<br><span class="muted">${esc(r.reason)}</span>` : ""}</p>
        <div class="grid2">
          ${r.ok ? `<button class="danger" id="fixNo">Corregir: era incorrecta</button>` : `<button id="fixOk">Corregir: era correcta</button>`}
          ${!r.ok && !r.ended ? `<button class="primary" id="reopen">Seguir ya</button>` : ""}
        </div>` : ""}
      ${H.answers.length ? `<h3>Respuestas de esta canción</h3><ul class="list">${H.answers.map((a) =>
        `<li><span>${teamChip(a.team)} ${esc(a.answer)}</span><span class="small" style="color:var(${a.verdict === "ok" ? "--ok" : a.verdict === "no" ? "--bad" : "--muted"})">${a.verdict || "…"}</span></li>`).join("")}</ul>` : ""}`}`;
  $("#spc") && ($("#spc").onclick = spotifyConnect);
  $("#spx") && ($("#spx").onclick = () => { ls.set("sp-token", null); spotifyConnect(); });
  $("#eye") && ($("#eye").onclick = () => { H.showTitle = !H.showTitle; renderSong(); });
  $("#play") && ($("#play").onclick = spPlay);
  $("#pause") && ($("#pause").onclick = spPause);
  $("#next") && ($("#next").onclick = async () => { await spNext(); refreshNowPlaying(); });
  $("#total") && ($("#total").onchange = (e) => { ls.set("song-total", Number(e.target.value)); if (H.live.game === "cancion") setLive("cancion", H.live.phase, { ...d, total: Number(e.target.value) }); });
  $("#openNext") && ($("#openNext").onclick = () => openSong(true));
  $("#openCur") && ($("#openCur").onclick = () => openSong(false));
  $("#reopen") && ($("#reopen").onclick = () => { clearTimeout(H.autoResume); reopenSong(); });
  $("#jOk") && ($("#jOk").onclick = () => judgeSong(true));
  $("#jNo") && ($("#jNo").onclick = () => judgeSong(false));
  $("#fixOk") && ($("#fixOk").onclick = () => overrideSong(true));
  $("#fixNo") && ($("#fixNo").onclick = () => overrideSong(false));
}

// ============ Música: playlist del concurso, música de fondo y cola ============
// pl-contest: { uri, name, total, order: [posiciones al azar], idx }
// pl-bg:      { uri, name }
// bg-resume:  { context, track, pos } dónde iba la música de fondo al empezar el concurso
H.qSearch = ""; H.qResults = []; H.qUpcoming = null; H.qBusy = false; H.playlists = null;
const trackRow = (t) => ({ uri: t.uri, title: t.name, artist: (t.artists || []).map((a) => a.name).join(", "), img: t.album?.images?.slice(-1)[0]?.url || "" });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const shuffle = (n) => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function playlistUriFrom(text) {
  const t = String(text || "").trim();
  const m = t.match(/playlist[/:]([A-Za-z0-9]{10,})/);
  return m ? "spotify:playlist:" + m[1] : null;
}
async function loadPlaylists() {
  try {
    const r = await sp("GET", "/me/playlists?limit=50");
    H.playlists = (r?.items || []).filter(Boolean).map((p) => ({ uri: p.uri, name: p.name, total: p.tracks?.total ?? p.items?.total ?? 0 }));
  } catch (e) {
    H.playlists = [];
    toast(String(e.message).includes("403") || String(e.message).includes("401") ? "Toca Reconectar en Spotify para dar permiso a tus playlists" : e.message);
  }
  renderQueue();
}
async function playlistInfo(uri) {
  const id = uri.split(":").pop();
  const r = await sp("GET", `/playlists/${id}?fields=name,uri,tracks.total`);
  return { uri: r.uri || uri, name: r.name, total: r.tracks?.total || 0 };
}
async function setPlaylist(kind, uri) {
  if (!uri) return toast("Ese link no es de una playlist de Spotify");
  try {
    const known = (H.playlists || []).find((p) => p.uri === uri);
    const info = known && known.total ? known : await playlistInfo(uri);
    if (kind === "contest") {
      if (!info.total) return toast("Esa playlist está vacía");
      ls.set("pl-contest", { ...info, order: shuffle(info.total), idx: 0 });
      toast(`Concurso: ${info.name} (${info.total} canciones, en orden al azar)`);
    } else {
      ls.set("pl-bg", { uri: info.uri, name: info.name });
      toast("Música de fondo: " + info.name);
    }
  } catch (e) {
    toast("No pude abrir esa playlist. Usa una creada por ti (las de Spotify a veces no se pueden).");
  }
  renderQueue();
}

// Guarda dónde iba la música de fondo (solo si no está sonando el concurso)
async function saveResume() {
  try {
    const st = await sp("GET", "/me/player");
    const contest = ls.get("pl-contest", null);
    if (!st?.item || (contest && st.context?.uri === contest.uri)) return;
    ls.set("bg-resume", { context: st.context?.uri || null, track: st.item.uri, pos: st.progress_ms || 0 });
  } catch {}
}
async function playContestNext() {
  const c = ls.get("pl-contest", null);
  if (!c) return false;
  if (c.idx >= c.order.length) { toast("Se acabaron las canciones del concurso. Elige la playlist de nuevo para barajar."); return false; }
  await saveResume();
  try {
    await sp("PUT", "/me/player/play", { context_uri: c.uri, offset: { position: c.order[c.idx] }, position_ms: 0 });
  } catch (e) { toast(e.message); return false; }
  ls.set("pl-contest", { ...c, idx: c.idx + 1 });
  await wait(900);
  return true;
}
// Vuelve a la música de fondo: donde quedó, o la playlist de fondo desde el principio
async function backToMusic() {
  const r = ls.get("bg-resume", null), bg = ls.get("pl-bg", null);
  try {
    if (r?.context) await sp("PUT", "/me/player/play", { context_uri: r.context, offset: { uri: r.track }, position_ms: r.pos });
    else if (r?.track) await sp("PUT", "/me/player/play", { uris: [r.track], position_ms: r.pos });
    else if (bg) await sp("PUT", "/me/player/play", { context_uri: bg.uri });
    else return toast("Elige una playlist de fondo primero");
    ls.set("bg-resume", null);
    try { await sp("PUT", "/me/player/shuffle?state=true"); } catch {}
    toast("Volvió la música de fondo");
    await wait(800); refreshNowPlaying(); queueLoad();
  } catch (e) {
    // si la canción guardada ya no está en esa playlist, parte la de fondo
    if (bg) { try { await sp("PUT", "/me/player/play", { context_uri: bg.uri }); ls.set("bg-resume", null); return toast("Volvió la música de fondo"); } catch {} }
    toast(e.message);
  }
}

async function queueSearch() {
  const term = H.qSearch.trim(); if (!term) return;
  H.qBusy = true; renderQueue();
  try {
    const r = await sp("GET", "/search?type=track&limit=8&q=" + encodeURIComponent(term));
    H.qResults = (r?.tracks?.items || []).map(trackRow);
    if (!H.qResults.length) toast("No encontré nada con eso");
  } catch (e) { toast(e.message); }
  H.qBusy = false; renderQueue();
}
async function queueAdd(uri, title) {
  try {
    await sp("POST", "/me/player/queue?uri=" + encodeURIComponent(uri));
    toast("Agregada: " + title);
    await queueLoad();
  } catch (e) { toast(e.message); renderQueue(); }
}
async function queueLoad() {
  try {
    const r = await sp("GET", "/me/player/queue");
    H.qUpcoming = (r?.queue || []).slice(0, 6).map(trackRow);
  } catch (e) { H.qUpcoming = null; }
  renderQueue();
}
function renderQueue() {
  const el = $("#p-queue"); if (!el) return;
  const connected = !!ls.get("sp-token", null);
  if (!connected) { el.innerHTML = `<h2>Música</h2><p class="muted small">Conecta Spotify en la sección Canción para elegir playlists y agregar canciones.</p>`; return; }
  const contest = ls.get("pl-contest", null), bg = ls.get("pl-bg", null), resume = ls.get("bg-resume", null);
  const opts = (sel) => (H.playlists || []).map((p) => `<option value="${esc(p.uri)}" ${sel === p.uri ? "selected" : ""}>${esc(p.name)} (${p.total})</option>`).join("");
  const picker = (kind, cur) => `
    <div class="row" style="flex-wrap:nowrap">
      ${H.playlists && H.playlists.length ? `<select data-pl="${kind}" style="flex:1;min-width:0"><option value="">Elegir de mis playlists…</option>${opts(cur?.uri)}</select>`
        : `<button class="small" data-loadpl>Ver mis playlists</button>`}
    </div>
    <form class="row" data-plform="${kind}" style="flex-wrap:nowrap"><input placeholder="…o pega el link" autocomplete="off"><button class="small">Usar</button></form>`;
  const row = (t, add) => `<li class="trk">${t.img ? `<img src="${esc(t.img)}" alt="">` : ""}<span class="t"><strong>${esc(t.title)}</strong><span class="small muted">${esc(t.artist)}</span></span>
    ${add ? `<button class="small" data-add="${esc(t.uri)}" data-title="${esc(t.title)}">+ Cola</button>` : ""}</li>`;
  el.innerHTML = `<h2>Música</h2>
    <div class="plbox">
      <h3>Playlist del concurso</h3>
      ${contest ? `<p class="small"><strong>${esc(contest.name)}</strong> · quedan ${contest.order.length - contest.idx} de ${contest.total} <span class="muted">(orden al azar)</span></p>` : `<p class="small muted">"Siguiente canción y abrir" toma canciones de esta lista, sin tocar la música de fondo.</p>`}
      ${picker("contest", contest)}
    </div>
    <div class="plbox">
      <h3>Música de fondo</h3>
      ${bg ? `<p class="small"><strong>${esc(bg.name)}</strong></p>` : `<p class="small muted">La que suena el resto de la fiesta.</p>`}
      ${picker("bg", bg)}
      <button class="primary" id="bgPlay" style="width:100%">${resume ? "▶ Terminar concurso y volver a la música" : "▶ Poner música de fondo"}</button>
    </div>
    <h3>Agregar a la cola</h3>
    <form id="qf" class="row" style="flex-wrap:nowrap"><input id="qIn" placeholder="Canción o artista" value="${esc(H.qSearch)}" autocomplete="off">
      <button class="primary" ${H.qBusy ? "disabled" : ""}>${H.qBusy ? "…" : "Buscar"}</button></form>
    ${H.qResults.length ? `<ul class="list">${H.qResults.map((t) => row(t, true)).join("")}</ul>` : ""}
    <div class="row" style="justify-content:space-between"><h3>Próximas en la cola</h3><button class="small" id="qRef">Actualizar</button></div>
    ${H.qUpcoming == null ? `<p class="small muted">Toca "Actualizar" para ver la cola.</p>`
      : H.qUpcoming.length ? `<ul class="list">${H.qUpcoming.map((t) => row(t, false)).join("")}</ul>` : `<p class="small muted">La cola está vacía.</p>`}
    <p class="small muted">La cola suena después de la canción actual. Durante el concurso conviene no agregar, para que no se mezcle.</p>`;
  el.querySelectorAll("[data-loadpl]").forEach((b) => b.onclick = () => { b.disabled = true; b.textContent = "Cargando…"; loadPlaylists(); });
  el.querySelectorAll("[data-pl]").forEach((s) => s.onchange = () => s.value && setPlaylist(s.dataset.pl, s.value));
  el.querySelectorAll("[data-plform]").forEach((f) => f.onsubmit = (e) => { e.preventDefault(); setPlaylist(f.dataset.plform, playlistUriFrom(f.querySelector("input").value)); });
  $("#bgPlay").onclick = backToMusic;
  const i = $("#qIn"); i.oninput = () => { H.qSearch = i.value; };
  $("#qf").onsubmit = (e) => { e.preventDefault(); H.qSearch = i.value; queueSearch(); };
  $("#qRef").onclick = queueLoad;
  el.querySelectorAll("[data-add]").forEach((b) => b.onclick = () => { b.disabled = true; queueAdd(b.dataset.add, b.dataset.title); });
}

// ============ Pedidos de los invitados ============
// Los jugadores no tienen Spotify: escriben en song_requests y este panel busca y agrega a la cola.
// Estados: searching → results → requested → queued | waiting (concurso) | rejected
H.requests = []; H.reqBusy = false; H.reqSig = "";
const contestActive = () => !!ls.get("bg-resume", null) || (H.live.game === "cancion" && ["playing", "answering", "judging", "result"].includes(H.live.phase));
async function processRequests() {
  if (H.reqBusy || !ls.get("sp-token", null)) return;
  H.reqBusy = true;
  try {
    const all = await q(db.from("song_requests").select("*").order("id"));
    H.requests = all.slice(-80);
    const fresh = (r) => Date.now() - new Date(r.created_at).getTime() < 10 * 60 * 1000;
    for (const r of H.requests.filter((x) => x.status === "searching" && fresh(x))) {
      try {
        const res = await sp("GET", "/search?type=track&limit=6&q=" + encodeURIComponent(r.query));
        await q(db.from("song_requests").update({ status: "results", results: (res?.tracks?.items || []).map(trackRow) }).eq("id", r.id));
      } catch { await q(db.from("song_requests").update({ status: "error" }).eq("id", r.id)); }
    }
    const auto = ls.get("req-auto", true), busy = contestActive();
    for (const r of H.requests.filter((x) => x.status === "requested" || x.status === "waiting")) {
      if (busy) { if (r.status !== "waiting") await q(db.from("song_requests").update({ status: "waiting" }).eq("id", r.id)); continue; }
      if (auto) await queueRequest(r, true);
    }
    H.requests = (await q(db.from("song_requests").select("*").order("id"))).slice(-80);
  } catch {}
  H.reqBusy = false;
  const s = sig(H.requests.map((r) => r.id + r.status), contestActive());
  if (s !== H.reqSig) { H.reqSig = s; renderRequests(); }
}
async function queueRequest(r, quiet) {
  try {
    await sp("POST", "/me/player/queue?uri=" + encodeURIComponent(r.chosen.uri));
    await q(db.from("song_requests").update({ status: "queued" }).eq("id", r.id));
    if (!quiet) toast("En la cola: " + r.chosen.title);
  } catch (e) { if (!quiet) toast(e.message); }
}
function renderRequests() {
  const el = $("#p-req"); if (!el) return;
  const auto = ls.get("req-auto", true);
  const waiting = H.requests.filter((r) => ["requested", "waiting"].includes(r.status) && r.chosen);
  const done = H.requests.filter((r) => r.status === "queued").slice(-6).reverse();
  const line = (r, actions) => `<li class="trk"><span class="t"><strong>${esc(r.chosen.title)}</strong><span class="small muted">${esc(r.chosen.artist)} · ${esc(r.player)}</span></span>${actions}</li>`;
  el.innerHTML = `<h2>Pedidos de invitados</h2>
    <label style="flex-direction:row;align-items:center;gap:8px;color:var(--fg)"><input type="checkbox" id="rAuto" ${auto ? "checked" : ""}> Agregar a la cola automáticamente</label>
    ${!ls.get("sp-token", null) ? `<p class="small muted">Conecta Spotify para atender los pedidos.</p>` : ""}
    ${contestActive() ? `<p class="small">Hay concurso: los pedidos esperan y entran al volver a la música.</p>` : ""}
    <h3>Esperando (${waiting.length})</h3>
    ${waiting.length ? `<ul class="list">${waiting.map((r) => line(r, `<button class="small" data-rno="${r.id}">✗</button><button class="small primary" data-rok="${r.id}">✓</button>`)).join("")}</ul>` : `<p class="small muted">Nada pendiente.</p>`}
    <h3>Ya en la cola</h3>
    ${done.length ? `<ul class="list">${done.map((r) => line(r, "")).join("")}</ul>` : `<p class="small muted">Aún no hay.</p>`}`;
  $("#rAuto").onchange = (e) => { ls.set("req-auto", e.target.checked); processRequests(); };
  el.querySelectorAll("[data-rok]").forEach((b) => b.onclick = async () => { b.disabled = true; await queueRequest(H.requests.find((r) => r.id == b.dataset.rok)); H.reqSig = ""; processRequests(); });
  el.querySelectorAll("[data-rno]").forEach((b) => b.onclick = async () => { b.disabled = true; await q(db.from("song_requests").update({ status: "rejected" }).eq("id", b.dataset.rno)); H.reqSig = ""; processRequests(); });
}

// ============ Trivia ============
// La trivia entra a la tabla general como una fila por equipo que se reemplaza en cada pregunta:
// promedio por jugador / 1000 × TRIVIA_POINTS (un equipo que acierta entero y al instante suma TRIVIA_POINTS por pregunta)
const TRIVIA_NOTE = "Trivia (automático)";
async function syncTriviaScores() {
  const st = triviaStandings(H.matches);
  await q(db.from("scores").delete().eq("game", "trivia").eq("note", TRIVIA_NOTE));
  const rows = [1, 2, 3, 4].filter((t) => st.teams[t].avg > 0)
    .map((t) => ({ team: t, game: "trivia", points: Math.round(st.teams[t].avg * CONFIG.TRIVIA_POINTS) / 1000, note: TRIVIA_NOTE }));
  if (rows.length) await q(db.from("scores").insert(rows));
}

// Calcula los puntos de cada uno, guarda la pregunta y la muestra en los celulares. También sirve para corregir la correcta.
async function triviaReveal(correct) {
  if (H.revealing) return;
  H.revealing = true;
  try {
    const d = H.live.data;
    H.votes = await q(db.from("trivia_votes").select("*").eq("question_id", d.qid));
    const answers = H.votes.filter((v) => v.player !== CONFIG.TRIVIA_HOST).map((v) => {
      const ms = Date.parse(v.updated_at) - d.qid;   // el celular guarda qid + lo que tardó
      return { player: v.player, team: v.team, option: v.option, ms, pts: v.option === correct ? kahootPoints(ms, d.secs, d.mult) : 0 };
    });
    const counts = d.options.map((_, i) => answers.filter((a) => a.option === i).length);
    await q(db.from("matches").delete().eq("game", "trivia").eq("data->>qid", String(d.qid)));
    await q(db.from("matches").insert({ game: "trivia", data: { qid: d.qid, question: d.question, options: d.options, correct, mult: d.mult, answers } }));
    H.matches = await q(db.from("matches").select("*").order("created_at"));
    await syncTriviaScores();
    await setLive("trivia", "reveal", { ...d, reveal: { correct, counts } });
  } finally { H.revealing = false; }
}

function renderTriviaLive() {
  const box = $("#tLive"); if (!box) return;
  const on = H.live.game === "trivia", d = on ? H.live.data || {} : {}, ph = H.live.phase;
  const pick = (label) => `<p class="small muted">${label}</p><div class="grid2">${(d.options || []).map((o, i) =>
    `<button data-correct="${i}" style="border-left:6px solid ${OPTS[i].color}">${OPTS[i].shape} ${esc(o)}</button>`).join("")}</div>`;
  let liveHtml = "";
  if (d.qid && ph === "open") {
    const key = ls.get("trivia-key", {}), known = key?.qid === d.qid;
    const left = Math.max(0, Math.ceil((d.qid + d.secs * 1000 - Date.now()) / 1000));
    liveHtml = `<div class="card" style="background:var(--panel-2)">
      <span class="eyebrow">Pregunta ${d.n}${d.mult > 1 ? " · doble" : ""} · respondiendo</span><strong>${esc(d.question)}</strong>
      <div class="countdown" id="tTimer">${left}</div>
      <p style="text-align:center"><strong>${H.votes.length}</strong> ${H.votes.length === 1 ? "respuesta" : "respuestas"}</p>
      ${known ? `<p class="small muted">Correcta: ${OPTS[key.correct].shape} ${esc(d.options[key.correct])}. Se revela sola cuando se acaba el tiempo.</p>
        <button id="tNow">Revelar ahora</button>`
      : pick("Este aparato no sabe cuál es la correcta (la pregunta se lanzó desde otro). Tócala para revelar:")}
    </div>`;
  } else if (d.qid && ph === "reveal") {
    const r = d.reveal;
    liveHtml = `<div class="card" style="background:var(--panel-2)">
      <span class="eyebrow">Pregunta ${d.n} · revelada</span><strong>${esc(d.question)}</strong>
      <ul class="list">${d.options.map((o, i) => `<li style="${i === r.correct ? "outline:2px solid var(--ok)" : ""}"><span>${OPTS[i].shape} ${esc(o)}</span><strong>${r.counts[i]}</strong></li>`).join("")}</ul>
      <details><summary class="small muted">¿Marcaste mal la correcta?</summary>${pick("Toca la que era; los puntos se recalculan.")}</details>
    </div>`;
  }
  box.innerHTML = liveHtml + renderTriviaBoard(triviaStandings(H.matches), null);
  $("#tNow") && ($("#tNow").onclick = () => triviaReveal(ls.get("trivia-key").correct));
  box.querySelectorAll("[data-correct]").forEach((b) => b.onclick = () => triviaReveal(Number(b.dataset.correct)));
}

function renderTrivia() {
  const el = $("#p-trivia");
  const draft = ls.get("trivia-draft", { q: "", o: ["", "", "", ""], correct: null, secs: 20, double: false });
  const open = H.live.game === "trivia" && H.live.phase === "open";
  el.innerHTML = `<h2>Trivia</h2><div id="tLive" style="display:flex;flex-direction:column;gap:12px"></div>
    <form id="tf" style="display:flex;flex-direction:column;gap:8px">
      <h3>Nueva pregunta</h3>
      <label>Pregunta<input id="tQ" value="${esc(draft.q)}"></label>
      <p class="small muted">Marca la correcta con el círculo.</p>
      ${[0, 1, 2, 3].map((i) => `<div class="row tOpt" style="--o:${OPTS[i].color}">
        <input type="radio" name="tC" value="${i}" ${draft.correct === i ? "checked" : ""} aria-label="Correcta ${OPTS[i].shape}">
        <span class="shape">${OPTS[i].shape}</span><input class="tO" data-i="${i}" value="${esc(draft.o[i])}"></div>`).join("")}
      <div class="row">
        <label>Tiempo<select id="tSecs">${[10, 20, 30, 60].map((s) => `<option value="${s}" ${draft.secs == s ? "selected" : ""}>${s} s</option>`).join("")}</select></label>
        <label style="flex-direction:row;align-items:center;gap:8px;align-self:flex-end"><input type="checkbox" id="tDouble" ${draft.double ? "checked" : ""}> Puntaje doble</label>
      </div>
      <button class="primary" ${open ? "disabled" : ""}>${open ? "Hay una pregunta en curso" : "Lanzar pregunta"}</button>
    </form>`;
  const save = () => {
    const c = el.querySelector("[name=tC]:checked");
    ls.set("trivia-draft", { q: $("#tQ").value, o: [...el.querySelectorAll(".tO")].map((x) => x.value), correct: c ? Number(c.value) : null, secs: Number($("#tSecs").value), double: $("#tDouble").checked });
  };
  el.querySelectorAll("input,select").forEach((x) => { x.oninput = save; x.onchange = save; });
  $("#tf").onsubmit = async (e) => {
    e.preventDefault(); save();
    const dr = ls.get("trivia-draft");
    const filled = dr.o.map((s, i) => ({ s: s.trim(), i })).filter((x) => x.s);
    const correct = filled.findIndex((x) => x.i === dr.correct);
    if (!dr.q.trim() || filled.length < 2) return toast("Escribe la pregunta y al menos 2 alternativas");
    if (correct < 0) return toast("Marca cuál es la correcta");
    const qid = Date.now();
    ls.set("trivia-key", { qid, correct });   // la correcta queda solo en este panel hasta revelar
    H.votes = [];
    const n = H.matches.filter((m) => m.game === "trivia" && m.data.answers).length + 1;
    await setLive("trivia", "open", { qid, n, question: dr.q.trim(), options: filled.map((x) => x.s), secs: dr.secs, mult: dr.double ? 2 : 1 });
    ls.set("trivia-draft", { q: "", o: ["", "", "", ""], correct: null, secs: dr.secs, double: false });
    render();
  };
  renderTriviaLive();
}

// ============ Mejor disfraz ============
function renderCostume() {
  const el = $("#p-costume");
  const on = H.live.game === "disfraz", ph = on ? H.live.phase : "off", d = H.live.data || {};
  const cand = costumeCandidates(H.noms);
  const voters = new Set(H.ranks.map((r) => r.player)).size;
  el.innerHTML = `<h2>Mejor disfraz</h2>
    ${!on ? `<p class="muted small">Pon "Disfraz" en los celulares para empezar.</p>` : `
    <p><strong>Paso:</strong> ${{ idle: "Sin empezar", nominar: "Eligiendo candidatos", cerrado: "Candidatos listos", votar: "Votando", resultados: "Resultados publicados" }[ph] || ph}</p>
    ${ph === "nominar" || ph === "idle" ? `<ul class="list">${[1, 2, 3, 4].map((t) => {
      const c = cand[t]; const total = Object.values(c.counts).reduce((a, b) => a + b, 0);
      return `<li>${teamChip(t)} <span>${esc(c.candidate || "—")} ${c.candidate ? `(${c.counts[c.candidate]})` : ""}</span><span class="small muted">${total} votos</span></li>`; }).join("")}</ul>` : ""}
    ${d.candidates && ph !== "nominar" ? `<ul class="list">${[1, 2, 3, 4].map((t) => `<li>${teamChip(t)} <strong>${esc(d.candidates[t] || "—")}</strong></li>`).join("")}</ul>` : ""}
    ${ph === "votar" ? `<p class="small">${voters} de ${H.players.length} personas votaron.</p>` : ""}
    <div class="grid2">
      <button id="cNom" ${ph === "nominar" ? "disabled" : ""}>1 · Abrir nominación</button>
      <button id="cClose" ${ph !== "nominar" ? "disabled" : ""}>2 · Cerrar nominación</button>
      <button id="cVote" ${!d.candidates?.[1] || ph === "votar" ? "disabled" : ""}>3 · Abrir votación</button>
      <button class="primary" id="cRes" ${ph !== "votar" ? "disabled" : ""}>4 · Mostrar resultados</button>
    </div>
    ${ph === "resultados" && d.results ? `<ul class="list">${[1, 2, 3, 4].sort((a, b) => d.results[b].total - d.results[a].total)
      .map((t, i) => `<li><span>${i + 1}º ${teamChip(t)} ${esc(d.candidates[t])}</span><strong>${d.results[t].total.toFixed(2)}</strong></li>`).join("")}</ul>
      <p class="small muted">Suma los puntos del disfraz en "Puntajes".</p>` : ""}`}`;
  if (!on) return;
  $("#cNom").onclick = () => setLive("disfraz", "nominar", {});
  $("#cClose").onclick = () => {
    const c = costumeCandidates(H.noms), candidates = {};
    [1, 2, 3, 4].forEach((t) => candidates[t] = c[t].candidate);
    ls.set("costume-cands", candidates);
    setLive("disfraz", "cerrado", { candidates });
  };
  $("#cVote").onclick = () => setLive("disfraz", "votar", { candidates: d.candidates });
  $("#cRes").onclick = async () => {
    const results = costumeResults(H.ranks);
    await q(db.from("matches").delete().eq("game", "disfraz"));
    await q(db.from("matches").insert({ game: "disfraz", data: { candidates: d.candidates, results } }));
    await setLive("disfraz", "resultados", { candidates: d.candidates, results });
  };
}

// ============ Puntajes ============
function renderScores() {
  const el = $("#p-scores");
  el.innerHTML = `<h2>Puntajes</h2>${renderScoreboard(H.scores)}
    <form id="sf" class="row">
      <select id="sTeam">${[1, 2, 3, 4].map((t) => `<option value="${t}">Equipo ${t}</option>`).join("")}</select>
      <select id="sGame">${Object.entries(GAMES).map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select>
      <input id="sPts" type="number" step="0.5" placeholder="Pts" style="width:80px">
      <input id="sNote" placeholder="Nota (opcional)">
      <button class="primary" style="width:100%">Sumar</button>
    </form>
    <h3>Últimos</h3>
    <ul class="list">${H.scores.slice(0, 12).map((s) => `<li><span>${teamChip(s.team)} <strong>${s.points > 0 ? "+" : ""}${s.points}</strong> ${GAMES[s.game] || s.game}</span><span class="small muted" style="flex:1;overflow-wrap:anywhere">${esc(s.note || "")}</span><button class="small danger" data-del="${s.id}">Borrar</button></li>`).join("")}</ul>`;
  $("#sf").onsubmit = async (e) => {
    e.preventDefault();
    const pts = Number($("#sPts").value);
    if (!pts) return toast("Pon los puntos");
    await q(db.from("scores").insert({ team: Number($("#sTeam").value), game: $("#sGame").value, points: pts, note: $("#sNote").value || null }));
    toast("Puntos sumados");
  };
  el.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
    if (b.dataset.confirm) { await q(db.from("scores").delete().eq("id", b.dataset.del)); }
    else { b.dataset.confirm = 1; b.textContent = "¿Seguro?"; }
  });
}

// ============ Beerpong y caballos ============
const teamOpts = (sel) => [1, 2, 3, 4].map((t) => `<option value="${t}" ${sel == t ? "selected" : ""}>Equipo ${t}</option>`).join("");
function delMatchHandlers(el) {
  el.querySelectorAll("[data-mdel]").forEach((b) => b.onclick = async () => {
    if (b.dataset.confirm) await q(db.from("matches").delete().eq("id", b.dataset.mdel));
    else { b.dataset.confirm = 1; b.textContent = "¿Seguro?"; }
  });
}
function renderBeer() {
  const el = $("#p-beer");
  const items = H.matches.filter((m) => m.game === "beerpong");
  el.innerHTML = `<h2>Beerpong</h2>
    <form id="bf" class="row">
      <select id="bStage">${["Semi 1", "Semi 2", "3er lugar", "Final", "Otro"].map((s) => `<option>${s}</option>`).join("")}</select>
      <select id="bA">${teamOpts(1)}</select><span>vs</span><select id="bB">${teamOpts(2)}</select>
      <label style="flex-direction:row;align-items:center;gap:8px">Ganó <select id="bW"><option value="a">el primero</option><option value="b">el segundo</option></select></label>
      <button class="primary" style="width:100%">Guardar partido</button>
    </form>
    <ul class="list">${items.map((m) => `<li><span>${esc(m.data.stage)}</span><span>${teamChip(m.data.a)} vs ${teamChip(m.data.b)} · gana ${teamChip(m.data.winner)}</span><button class="small danger" data-mdel="${m.id}">Borrar</button></li>`).join("")}</ul>`;
  $("#bf").onsubmit = async (e) => {
    e.preventDefault();
    const a = Number($("#bA").value), b = Number($("#bB").value);
    if (a === b) return toast("Elige dos equipos distintos");
    await q(db.from("matches").insert({ game: "beerpong", data: { stage: $("#bStage").value, a, b, winner: $("#bW").value === "a" ? a : b } }));
    toast("Partido guardado");
  };
  delMatchHandlers(el);
}
function renderHorse() {
  const el = $("#p-horse");
  const items = H.matches.filter((m) => m.game === "caballos");
  el.innerHTML = `<h2>Carrera de caballos</h2>
    <form id="hf" class="row">
      ${[1, 2, 3, 4].map((p) => `<label>${p}º lugar<select class="hPos">${teamOpts(p)}</select></label>`).join("")}
      <button class="primary" style="width:100%">Guardar carrera</button>
    </form>
    <ul class="list">${items.map((m, i) => `<li><span>Carrera ${i + 1}</span><span>${m.data.order.map((t, j) => `${j + 1}º ${teamChip(t)}`).join(" ")}</span><button class="small danger" data-mdel="${m.id}">Borrar</button></li>`).join("")}</ul>`;
  $("#hf").onsubmit = async (e) => {
    e.preventDefault();
    const order = [...el.querySelectorAll(".hPos")].map((s) => Number(s.value));
    if (new Set(order).size !== 4) return toast("Cada equipo debe salir una vez");
    await q(db.from("matches").insert({ game: "caballos", data: { order } }));
    toast("Carrera guardada");
  };
  delMatchHandlers(el);
}
</script>
